<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudSat Cyclone Curtains</title>
  <meta name="description" content="CloudSat CPR reflectivity curtains for 174 tropical cyclone overpasses (2006-2019), on a globe with best tracks and Aqua MODIS imagery.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231a1a19'/%3E%3Cpath d='M16 6a10 10 0 1 0 10 10' fill='none' stroke='%23eeaa6f' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23cde2fb'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@4.1.2/plotly.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="bar">
    <h1>CloudSat Cyclone Curtains</h1>
    <div class="controls">
      <label class="field grow">
        <span>Overpass</span>
        <select id="overpass" aria-label="Overpass"></select>
      </label>
      <div class="stepper">
        <button id="prev" type="button" aria-label="Previous overpass" title="Previous overpass">&#8249;</button>
        <button id="next" type="button" aria-label="Next overpass" title="Next overpass">&#8250;</button>
      </div>
      <label class="field">
        <span>Basin</span>
        <select id="basin" aria-label="Basin filter"></select>
      </label>
      <label class="field">
        <span>Intensity</span>
        <select id="intensity" aria-label="Intensity filter">
          <option value="0">All</option>
          <option value="1">Tropical storm and up</option>
          <option value="2">Category 1 and up</option>
          <option value="4">Major (Category 3+)</option>
        </select>
      </label>
      <span id="count" class="count"></span>
    </div>
  </header>

  <main class="layout">
    <section class="map-wrap" aria-label="Globe of CloudSat overpasses">
      <div id="map"></div>
      <div id="legend" class="legend"></div>
    </section>

    <aside id="panel" class="panel" aria-live="polite"></aside>

    <section class="curtain-wrap" aria-label="CloudSat reflectivity curtain">
      <div class="curtain-head">
        <h2>CPR reflectivity curtain</h2>
        <div id="readout" class="readout">Hover the curtain or the CloudSat track on the globe.</div>
      </div>
      <div id="curtain"></div>
    </section>
  </main>

  <div id="banner" class="banner" hidden></div>
</body>
</html>
